# Tear down a PR preview when the PR closes (Phase A of atomic-sha-deploys):
# remove its S3 folder and prune its redirect namespace from the preview KVS.
#
# Previews are published by `scripts/deploy-preview.sh`, run by hand since
# automatic preview deployment was removed (c7b954e). This job still has to run
# on PR close so a hand-published preview is not left behind.
#
# Variables in the preview environment (same names deploy-preview.yml used):
#   vars.AWS_ROLE_ARN       - OIDC role for preview deploys
#   vars.S3_BUCKET          - preview site bucket
#   vars.CLOUDFRONT_DIST_ID - preview distribution id
#   vars.KVS_ARN_PREVIEW    - preview redirects KeyValueStore ARN (optional)
name: Cleanup preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # A fork PR never gets a preview -- previews are published by hand from a
    # branch in this repo -- and a fork cannot read environment values anyway,
    # so running there would only trip the guard below and re-redden the check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Required: every value below is scoped to the preview environment, not the
    # repository. Without this the job sees empty strings for all of them.
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # A variable, not a secret: the OIDC role ARN is not sensitive and the
          # preview environment stores it as a variable.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          # Pinned, as in deploy-preview.yml. CloudFront and ACM are us-east-1
          # only (infrastructure/bootstrap-policeconduct/providers.tf).
          aws-region: us-east-1

      - name: Remove preview folder
        env:
          S3_BUCKET_PREVIEW: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DIST_PREVIEW: ${{ vars.CLOUDFRONT_DIST_ID }}
        run: |
          set -euo pipefail
          # Guard before any --recursive delete: an empty PR_NUMBER would turn
          # the prefix into "pr-" and match every preview in the bucket.
          : "${S3_BUCKET_PREVIEW:?S3_BUCKET is not set in the preview environment}"
          : "${CLOUDFRONT_DIST_PREVIEW:?CLOUDFRONT_DIST_ID is not set in the preview environment}"
          case "${PR_NUMBER}" in
            ''|*[!0-9]*)
              echo "::error::Refusing to delete: PR_NUMBER is not a number (${PR_NUMBER})"
              exit 1
              ;;
          esac
          aws s3 rm "s3://${S3_BUCKET_PREVIEW}/pr-${PR_NUMBER}/" --recursive
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DIST_PREVIEW}" \
            --paths "/pr-${PR_NUMBER}/*"

      - name: Prune preview redirects
        if: ${{ vars.KVS_ARN_PREVIEW != '' }}
        env:
          KVS_ARN_PREVIEW: ${{ vars.KVS_ARN_PREVIEW }}
        run: |
          set -euo pipefail
          # An empty map prunes every r:pr-<N>: key for this namespace and adds none.
          echo '{"redirects":[]}' > empty-map.json
          node scripts/load-redirects.mjs \
            "${KVS_ARN_PREVIEW}" "r:pr-${PR_NUMBER}:" empty-map.json
